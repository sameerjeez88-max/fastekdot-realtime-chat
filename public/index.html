<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Rana Yasir Mahy Ud Din - FastekDot" />
  <title>FastekDot CollabChat | Developed by Rana Yasir Mahy Ud Din</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <!-- Join Screen -->
  <div id="join-screen" class="flex-grow flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8 w-full max-w-md">
      <div class="text-center mb-6">
        <span class="inline-block bg-indigo-600/20 text-indigo-400 text-xs font-semibold px-3 py-1 rounded-full mb-2">
          FastekDot Real-Time Engine
        </span>
        <h1 class="text-2xl font-bold text-white">CollabChat Workspace</h1>
        <p class="text-slate-400 text-sm mt-1">Instant WebSockets & Socket.io Collaboration</p>
      </div>

      <form id="join-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Display Name</label>
          <input type="text" id="username" required placeholder="e.g., Rana Yasir"
            class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Collaboration Room</label>
          <select id="room"
            class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
            <option value="Full-Stack-Dev">Full-Stack Dev Team</option>
            <option value="UI-UX-Design">UI/UX Design Studio</option>
            <option value="Upwork-Clients">Client Onboarding & Support</option>
            <option value="General-Lobby">General Lobby</option>
          </select>
        </div>

        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg">
          Join Workspace
        </button>
      </form>
    </div>
  </div>

  <!-- Chat Workspace Screen (Hidden initially) -->
  <div id="chat-screen" class="hidden flex-grow max-w-6xl w-full mx-auto p-4 flex flex-col md:flex-row gap-4 h-[85vh]">
    
    <!-- Sidebar: Room & Active Users -->
    <aside class="w-full md:w-64 bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col justify-between">
      <div>
        <div class="border-b border-slate-700 pb-3 mb-4">
          <p class="text-xs uppercase tracking-wider text-slate-400">Active Room</p>
          <h2 id="room-name" class="text-lg font-bold text-indigo-400 truncate">#Room</h2>
        </div>

        <p class="text-xs uppercase tracking-wider text-slate-400 mb-2">Online Members</p>
        <ul id="users-list" class="space-y-2 text-sm"></ul>
      </div>

      <button id="leave-btn"
        class="mt-4 w-full bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-600/40 py-2 rounded-lg text-sm font-medium transition">
        Leave Room
      </button>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-grow bg-slate-800 border border-slate-700 rounded-xl flex flex-col overflow-hidden">
      <!-- Chat Messages -->
      <div id="chat-messages" class="flex-grow p-5 overflow-y-auto space-y-3"></div>

      <!-- Typing Indicator -->
      <div id="typing-indicator" class="px-5 py-1 text-xs text-indigo-400 italic h-6"></div>

      <!-- Message Input Form -->
      <form id="chat-form" class="p-4 bg-slate-900/60 border-t border-slate-700 flex gap-3">
        <input id="msg-input" type="text" autocomplete="off" required placeholder="Type a message to collaborate..."
          class="flex-grow px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white" />
        <button type="submit"
          class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2.5 rounded-lg font-semibold text-white transition">
          Send
        </button>
      </form>
    </main>
  </div>

  <!-- Developer Branding Footer -->
  <footer class="py-3 text-center text-xs text-slate-400 border-t border-slate-800 bg-slate-950">
    Designed & Developed by
    <a href="https://ranayasir.unaux.com/" target="_blank" class="text-indigo-400 font-semibold hover:underline">
      Rana Yasir Mahy Ud Din
    </a>
    | Powered by <a href="https://www.fastekdot.com" target="_blank" class="text-slate-200 font-semibold hover:underline">FastekDot</a> © 2026
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
